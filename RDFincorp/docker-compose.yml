services:
  rdfincorp:
    build: .
    container_name: rdfincorp_banking
    ports:
      - "3000:3000"
    volumes:
      - ./database:/app/database
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
    networks:
      - rdfincorp_network

networks:
  rdfincorp_network:
    driver: bridge

